<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNSブランド研究室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: maximom風。グレージュの地にチェリーレッドを一点、角は丸く柔らかく。1カラムの読み物。上部にブランド切替、各ブランドは「概要→沿革→成功→課題→数字→マーケ分析→示唆→出典」の順 */
:root {
  --bg: #e8e4db; --card: #f5f2ec; --text: #22252a; --muted: #6b655b;
  --line: #d6d0c4; --accent: #901d22; --accent-soft: #f1dedb; --on-accent: #f5f2ec;
  --bar: #901d22; --grid: #dbd5c9; --good: #56603f; --good-soft: #dfe1d2;
  --warn: #8a5a1e; --warn-soft: #efe2cc; --info: #2f3a52; --info-soft: #dcdfe4;
  --font-body: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-brand: "Fredoka", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e21; --card: #27292d; --text: #ece7de; --muted: #aaa397;
    --line: #3a3b40; --accent: #e57d80; --accent-soft: #3b2527; --on-accent: #1d1e21;
    --bar: #d9666b; --grid: #34363b; --good: #b9c39e; --good-soft: #2c3127;
    --warn: #dcaa6a; --warn-soft: #3a3022; --info: #aeb7c9; --info-soft: #2a2e36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e21; --card: #27292d; --text: #ece7de; --muted: #aaa397;
  --line: #3a3b40; --accent: #e57d80; --accent-soft: #3b2527; --on-accent: #1d1e21;
  --bar: #d9666b; --grid: #34363b; --good: #b9c39e; --good-soft: #2c3127;
  --warn: #dcaa6a; --warn-soft: #3a3022; --info: #aeb7c9; --info-soft: #2a2e36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.75; font-size: 15px; }
.wrap { max-width: 900px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, .tl-title, .kpi .value { font-family: var(--font-display); }
h1 { font-size: 1.5rem; letter-spacing: .04em; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 1.15rem; margin: 0 0 12px; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0 0 4px; text-wrap: balance; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lead { color: var(--muted); font-size: .9rem; margin: 0 0 14px; max-width: 46em; }
.note { color: var(--muted); font-size: .82rem; margin: 6px 0 0; }
.sitenav { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.sitenav a { padding: 8px 12px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.sitenav a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }

/* ブランド切替 */
.switcher { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.switcher a { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 14px; border-radius: 999px; font-size: .9rem; text-decoration: none; font-weight: 600; }
.switcher a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.switcher a.ghost { border-style: dashed; color: var(--muted); font-weight: 400; }

/* セクション目次（スクロール位置へ移動） */
.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; padding: 8px 0; margin: 10px 0 20px; border-bottom: 1px solid var(--line); }
.toc button { font: inherit; font-size: .82rem; background: none; border: 0; color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.toc button:hover { background: var(--accent-soft); color: var(--accent); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

section.block { margin: 0 0 44px; scroll-margin-top: 60px; }
.eyebrow { font-family: var(--font-brand); font-size: .85rem; letter-spacing: .06em; text-transform: lowercase; color: var(--accent); font-weight: 700; margin: 0 0 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }

/* ヒーロー */
.hero { display: grid; gap: 16px; grid-template-columns: 1.3fr 1fr; align-items: start; margin-bottom: 20px; }
.brandname { font-family: var(--font-brand); font-weight: 600; color: var(--accent); font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; margin: 6px 0 6px; letter-spacing: .01em; }
.brandname small { font-size: .4em; color: var(--muted); font-family: var(--font-body); margin-left: 8px; letter-spacing: 0; }
.concept { font-family: var(--font-brand); font-weight: 500; font-size: 1.05rem; margin: 6px 0 10px; }
.status { display: inline-block; font-size: .75rem; padding: 1px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
dl.profile { display: grid; grid-template-columns: 6.5em 1fr; gap: 6px 12px; margin: 0; font-size: .88rem; }
dl.profile dt { color: var(--muted); }
dl.profile dd { margin: 0; min-width: 0; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi .label { font-size: .78rem; color: var(--muted); }
.kpi .value { font-size: 1.45rem; font-weight: 700; line-height: 1.3; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: .78rem; color: var(--muted); }

/* 出典・事実/分析ラベル */
sup.src { font-size: .68rem; margin-left: 2px; white-space: nowrap; }
sup.src a { text-decoration: none; color: var(--muted); }
sup.src a:hover { color: var(--accent); }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; padding: 0 7px; border-radius: 4px; vertical-align: 2px; margin-right: 6px; white-space: nowrap; }
.tag.fact { background: var(--info-soft); color: var(--info); }
.tag.analysis { background: var(--warn-soft); color: var(--warn); }
.tag.estimate { background: var(--warn-soft); color: var(--warn); }

/* 年表 */
ol.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
ol.timeline li { position: relative; padding: 0 0 18px 20px; }
ol.timeline li::before { content: ""; position: absolute; left: -7px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--accent); }
ol.timeline li.major::before { background: var(--accent); }
.tl-date { font-size: .8rem; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-title { font-weight: 700; }
.tl-body { font-size: .88rem; color: var(--muted); }

/* 成功・課題カード */
.cases { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.case h3 { line-height: 1.5; }
.case p { margin: 4px 0 0; font-size: .88rem; }
.case .why { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .84rem; color: var(--muted); }
.case .why b { color: var(--text); font-weight: 600; }
.risk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--card); }
.risk-row + .risk-row { margin-top: 10px; }
.risk-row > div { padding: 12px 16px; min-width: 0; }
.risk-row > div:first-child { border-right: 1px solid var(--line); }
.risk-row .lbl { font-size: .72rem; font-weight: 700; letter-spacing: .06em; margin-bottom: 2px; }
.risk-row .lbl.problem { color: var(--warn); }
.risk-row .lbl.fix { color: var(--good); }
.risk-row p { margin: 0; font-size: .88rem; }
.callout { background: var(--info-soft); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: .86rem; margin: 0 0 12px; }

/* グラフ（横棒・同一スケール） */
.chart-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.hbars { display: grid; gap: 10px; margin-top: 10px; }
.hb { display: grid; grid-template-columns: minmax(7em, 11em) 1fr 8em; gap: 10px; align-items: center; font-size: .84rem; }
.hb .lab { min-width: 0; line-height: 1.35; }
.hb .lab small { display: block; color: var(--muted); font-size: .74rem; }
.hb .track { position: relative; height: 14px; background: var(--grid); border-radius: 0 4px 4px 0; cursor: default; }
.hb .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.hb .fill.est { background: repeating-linear-gradient(135deg, var(--bar) 0 4px, transparent 4px 7px); border: 1px solid var(--bar); }
.hb .range { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--bar) 0 2px, transparent 2px 7px); opacity: .55; border-radius: 0 4px 4px 0; }
.hb .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.hb .track:hover .fill, .hb .track:focus .fill { filter: brightness(1.08); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 18px; height: 10px; vertical-align: -1px; margin-right: 5px; border-radius: 2px; }
.legend i.solid { background: var(--bar); }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); border: 1px solid var(--bar); }
.axis { display: grid; grid-template-columns: minmax(7em, 11em) 1fr 8em; gap: 10px; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis .ticks { display: flex; justify-content: space-between; }
.tooltip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: .78rem; z-index: 20; max-width: 260px; line-height: 1.5; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
details { margin-top: 10px; font-size: .85rem; }
summary { cursor: pointer; color: var(--muted); }

/* マーケティング分析 */
.persona { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.persona ul, .plain { margin: 6px 0 0; padding-left: 1.2em; font-size: .88rem; }
.persona li, .plain li { margin: 2px 0; }
.funnel { display: grid; gap: 6px; }
.fn { display: grid; grid-template-columns: 7.5em 1fr; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.fn .stage { background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 10px 12px; font-size: .88rem; display: flex; flex-direction: column; justify-content: center; line-height: 1.35; }
.fn .stage small { font-weight: 400; font-size: .7rem; letter-spacing: .06em; }
.fn .body { padding: 10px 14px; font-size: .86rem; min-width: 0; }
.fn .body b { font-weight: 600; }
.fourp { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.swot { display: grid; gap: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--card); }
.swot > div { padding: 14px 16px; min-width: 0; }
.swot > div:nth-child(1), .swot > div:nth-child(2) { border-bottom: 1px solid var(--line); }
.swot > div:nth-child(odd) { border-right: 1px solid var(--line); }
.swot h3 { font-size: .9rem; }
.swot h3 span { color: var(--muted); font-weight: 400; font-size: .75rem; margin-left: 6px; }
.subhead { font-size: .95rem; margin: 26px 0 10px; }

/* 示唆 */
ol.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: l; }
ol.lessons li { counter-increment: l; display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
ol.lessons li::before { content: counter(l); font-family: var(--font-brand); font-weight: 600; font-size: 1.5rem; color: var(--accent); line-height: 1.1; }
ol.lessons h3 { margin: 0; }
ol.lessons p { margin: 4px 0 0; font-size: .88rem; }
ol.lessons .try { margin-top: 6px; font-size: .84rem; background: var(--good-soft); color: var(--text); border-radius: 8px; padding: 6px 10px; }
ol.lessons .try b { color: var(--good); }

ol.sources { margin: 0; padding-left: 2.6em; font-size: .82rem; }
ol.sources li { margin: 4px 0; overflow-wrap: anywhere; }
ol.sources li:target { background: var(--accent-soft); }
.muted { color: var(--muted); }
.placeholder { border: 1px dashed var(--line); color: var(--muted); text-align: center; }
pre.code { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .78rem; overflow-x: auto; line-height: 1.5; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .fourp, .swot { grid-template-columns: 1fr; }
  .swot > div { border-right: 0 !important; border-bottom: 1px solid var(--line); }
  .swot > div:last-child { border-bottom: 0; }
  .risk-row { grid-template-columns: 1fr; }
  .risk-row > div:first-child { border-right: 0; border-bottom: 1px solid var(--line); }
  .hb, .axis { grid-template-columns: 6.5em 1fr 5em; gap: 8px; }
  .fn { grid-template-columns: 5.5em 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
</style>

(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("brand-data").textContent);
  var BRANDS = DATA.brands || [];
  var view = document.getElementById("view");
  var tip = document.getElementById("tip");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  // 本文中で <b> だけ許可（データは自分で書くもの）
  function rich(s) { return esc(s).replace(/&lt;(\/?)b&gt;/g, "<$1b>"); }
  function srcs(list, brand) {
    if (!list || !list.length) return "";
    return '<sup class="src">' + list.map(function (id) {
      var n = id.replace(/^S/, "");
      return '<a href="#" data-src="' + esc(brand.id + "-" + id) + '" title="出典 ' + esc(id) + '">[' + esc(n) + "]</a>";
    }).join("") + "</sup>";
  }
  function kindTag(kind) {
    if (kind === "analysis") return '<span class="tag analysis">分析</span>';
    if (kind === "fact") return '<span class="tag fact">事実</span>';
    return "";
  }

  document.getElementById("lead").textContent =
    "SNS発ブランドの成り立ち・成功事例・課題・数字・マーケティング分析を、出典付きでまとめた研究ノートです。" +
    "想定ターゲット：" + (DATA.site.target_summary || "") + "。確認日：" + (DATA.site.checked || "");

  // ブランド切替
  function renderSwitcher(current) {
    var html = BRANDS.map(function (b) {
      return '<a href="#' + esc(b.id) + '"' + (current === b.id ? ' aria-current="page"' : "") + ">" + esc(b.name) + "</a>";
    }).join("");
    html += '<a href="#compare"' + (current === "compare" ? ' aria-current="page"' : "") + ">ブランド比較</a>";
    html += '<a href="#howto" class="ghost"' + (current === "howto" ? ' aria-current="page"' : "") + ">＋ ブランドを追加するには</a>";
    document.getElementById("switcher").innerHTML = html;
  }

  // 横棒グラフ（同じ物差しで描く）
  function niceMax(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] * p >= v) return steps[i] * p; }
    return 10 * p;
  }
  function fmt(v, unit) { return (unit === "万円" ? v.toLocaleString("ja-JP") : String(v)) + unit; }
  function hbars(chart, brand) {
    var max = niceMax(Math.max.apply(null, chart.rows.map(function (r) { return r.high || r.value; })) * 1.05);
    var hasEst = chart.rows.some(function (r) { return r.kind === "estimate"; });
    var rows = chart.rows.map(function (r) {
      var w = (r.value / max * 100).toFixed(2);
      var label = r.high ? fmt(r.value, chart.unit).replace(chart.unit, "") + "〜" + fmt(r.high, chart.unit) : fmt(r.value, chart.unit);
      var tipText = r.label + "（" + r.sub + "）：" + label + (r.kind === "estimate" ? "　※試算" : "");
      var range = r.high ? '<span class="range" style="left:' + w + "%;width:" + ((r.high - r.value) / max * 100).toFixed(2) + '%"></span>' : "";
      return '<div class="hb"><div class="lab">' + esc(r.label) + "<small>" + esc(r.sub) + "</small></div>" +
        '<div class="track" tabindex="0" data-tip="' + esc(tipText) + '" aria-label="' + esc(tipText) + '">' +
        '<span class="fill' + (r.kind === "estimate" ? " est" : "") + '" style="width:' + w + '%"></span>' + range + "</div>" +
        '<div class="num">' + esc(label) + srcs(r.src, brand) + "</div></div>";
    }).join("");
    var ticks = [0, max / 2, max].map(function (t) { return "<span>" + esc(fmt(t, chart.unit)) + "</span>"; }).join("");
    var legend = hasEst ? '<div class="legend"><span><i class="solid"></i>報道値</span><span><i class="hatch"></i>試算（推定）</span></div>' : "";
    var table = '<details><summary>表で見る</summary><div class="scroll-x"><table><thead><tr><th>項目</th><th>時期</th><th>値</th><th>種別</th></tr></thead><tbody>' +
      chart.rows.map(function (r) {
        return "<tr><td>" + esc(r.label) + "</td><td>" + esc(r.sub) + '</td><td class="num">' + esc(r.high ? r.value + "〜" + r.high + chart.unit : fmt(r.value, chart.unit)) +
          "</td><td>" + (r.kind === "estimate" ? "試算" : "報道値") + "</td></tr>";
      }).join("") + "</tbody></table></div></details>";
    return '<div class="card"><h3>' + esc(chart.title) + '</h3><div class="hbars">' + rows + "</div>" +
      '<div class="axis" aria-hidden="true"><span></span><div class="ticks">' + ticks + "</div><span></span></div>" +
      legend + '<p class="note">' + esc(chart.note || "") + "</p>" + table + "</div>";
  }

  function section(id, eyebrow, title, inner) {
    return '<section class="block" id="sec-' + id + '"><p class="eyebrow">' + esc(eyebrow) + "</p><h2>" + esc(title) + "</h2>" + inner + "</section>";
  }

  function renderBrand(b) {
    var toc = [["overview", "概要"], ["history", "成り立ち"], ["success", "成功事例"], ["risk", "課題・失敗"], ["numbers", "数字"], ["marketing", "マーケ分析"], ["lessons", "お店への活かし方"], ["sources", "出典"]];
    var h = "";
    h += '<nav class="toc" aria-label="このページの目次">' + toc.map(function (t) { return '<button type="button" data-go="sec-' + t[0] + '">' + t[1] + "</button>"; }).join("") + "</nav>";

    // 概要
    var hero = '<div class="hero"><div><span class="status">' + esc(b.status) + "</span>" +
      '<p class="brandname">' + esc(b.name) + "<small>" + esc(b.kana) + "</small></p>" +
      '<p class="concept">' + esc(b.concept_word) + "</p><p style=\"margin:0;font-size:.9rem\">" + esc(b.concept) + "</p></div>" +
      '<div class="card"><dl class="profile">' + b.profile.map(function (p) { return "<dt>" + esc(p.k) + "</dt><dd>" + esc(p.v) + srcs(p.src, b) + "</dd>"; }).join("") + "</dl></div></div>";
    var kpis = '<div class="kpis">' + b.kpis.map(function (k) {
      return '<div class="card kpi"><div class="label">' + esc(k.label) + '</div><div class="value">' + esc(k.value) + srcs(k.src, b) + '</div><div class="sub">' + esc(k.sub) + "</div></div>";
    }).join("") + "</div>";
    h += section("overview", "Overview", "概要", hero + kpis);

    // 沿革
    h += section("history", "History", "成り立ちと年表",
      '<ol class="timeline">' + b.timeline.map(function (t) {
        return '<li class="' + (t.major ? "major" : "") + '"><div class="tl-date">' + esc(t.date) + '</div><div class="tl-title">' + esc(t.title) + srcs(t.src, b) + '</div><div class="tl-body">' + esc(t.body) + "</div></li>";
      }).join("") + '</ol><p class="note">塗りつぶしの丸は、ブランドの転機になった出来事です。</p>');

    // 成功事例
    h += section("success", "Success", "成功事例とSNS戦略",
      '<div class="cases">' + b.successes.map(function (s) {
        return '<div class="card case"><h3>' + esc(s.title) + srcs(s.src, b) + "</h3><p>" + esc(s.body) + '</p><div class="why">' + rich(s.why) + "</div></div>";
      }).join("") + "</div>");

    // 課題・失敗
    h += section("risk", "Risks", "課題・失敗事例と対処",
      '<p class="callout">' + esc(b.risks_note) + "</p>" +
      b.risks.map(function (r) {
        return '<div class="risk-row"><div><div class="lbl problem">起きたこと・リスク</div><p>' + kindTag(r.kind) + esc(r.problem) + srcs(r.src, b) + '</p></div><div><div class="lbl fix">対処・考え方</div><p>' + esc(r.fix) + "</p></div></div>";
      }).join("") + '<p class="note"><span class="tag fact">事実</span>報道・公式で確認できた内容　<span class="tag analysis">分析</span>このサイトによる推察</p>');

    // 数字
    var sns = '<div class="card"><h3>Instagramフォロワー数（時点ごとの記録）</h3><div class="scroll-x"><table><thead><tr><th>アカウント</th><th>時点</th><th>フォロワー</th></tr></thead><tbody>' +
      b.sns_accounts.map(function (a) { return "<tr><td>" + esc(a.account) + "</td><td>" + esc(a.when) + '</td><td class="num">' + esc(a.followers) + srcs(a.src, b) + "</td></tr>"; }).join("") +
      '</tbody></table></div><p class="note">記事ごとに時点が違う参考値です。最新の数はInstagramで直接確認してください。</p></div>';
    h += section("numbers", "Numbers", "数字で見る", '<div class="chart-grid">' + hbars(b.charts.popup, b) + hbars(b.charts.annual, b) + sns + "</div>");

    // マーケ分析
    var m = b.marketing;
    var persona = '<div class="persona">' + ["core", "target"].map(function (k) {
      var p = m.persona[k];
      return '<div class="card"><h3>' + kindTag(p.kind || "fact") + esc(p.title) + srcs(p.src, b) + '</h3><ul>' + p.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
    }).join("") + "</div>";
    var funnel = '<div class="funnel">' + m.funnel.map(function (f) {
      return '<div class="fn"><div class="stage">' + esc(f.stage) + "<small>" + esc(f.en) + '</small></div><div class="body">' + rich(f.body) + srcs(f.src, b) + "</div></div>";
    }).join("") + "</div>";
    var fourp = '<div class="fourp">' + ["product", "price", "place", "promotion"].map(function (k) {
      var p = m.fourp[k];
      return '<div class="card"><h3>' + esc(p.title) + ' <span class="muted" style="font-weight:400;font-size:.75rem">' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + "</span>" + srcs(p.src, b) + '</h3><ul class="plain">' + p.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
    }).join("") + "</div>";
    var swot = '<div class="swot">' + ["s", "w", "o", "t"].map(function (k) {
      var p = m.swot[k];
      return "<div><h3>" + esc(p.title) + "<span>" + esc(p.en) + '</span></h3><ul class="plain">' + p.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
    }).join("") + '</div><p class="note">' + esc(m.swot.note) + "</p>";
    h += section("marketing", "Marketing", "マーケティング分析",
      '<h3 class="subhead">ターゲット・ペルソナ</h3>' + persona +
      '<h3 class="subhead">集客から購入、ファン化までの流れ</h3>' + funnel +
      '<h3 class="subhead">商品・価格・販路・販促（4P）</h3>' + fourp +
      '<h3 class="subhead">強み・弱み・機会・脅威（SWOT）</h3>' + swot);

    // 示唆
    h += section("lessons", "For my shop", "自分の子供服ショップへの活かし方",
      '<ol class="lessons">' + b.lessons.map(function (l) {
        return "<li><div><h3>" + esc(l.title) + "</h3><p>" + esc(l.body) + '</p><div class="try"><b>試すなら：</b>' + esc(l.try) + "</div></div></li>";
      }).join("") + "</ol>");

    // 出典
    h += section("sources", "Sources", "出典",
      '<div class="card"><ol class="sources">' + b.sources.map(function (s) {
        return '<li id="' + esc(b.id + "-" + s.id) + '"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a> <span class="muted">— ' + esc(s.site) + "</span></li>";
      }).join("") + '</ol><p class="note">確認日：' + esc(b.checked) + "。売上などの数値は各メディアの報道で、ブランドの公式発表ではないものを含みます。</p></div>");
    return h;
  }

  function renderCompare() {
    var keys = [];
    BRANDS.forEach(function (b) { Object.keys(b.compare || {}).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); }); });
    var head = "<tr><th>項目</th>" + BRANDS.map(function (b) { return '<th><a href="#' + esc(b.id) + '">' + esc(b.name) + "</a></th>"; }).join("") + '<th class="placeholder">次のブランド</th></tr>';
    var body = keys.map(function (k) {
      return "<tr><th>" + esc(k) + "</th>" + BRANDS.map(function (b) { return "<td>" + esc((b.compare || {})[k] || "—") + "</td>"; }).join("") + '<td class="placeholder">—</td></tr>';
    }).join("");
    var popupMax = {title: "百貨店ポップアップ 1週間の最高売上（ブランド別）", unit: "万円", note: "各ブランドの charts.popup の最大値を自動で並べています。",
      rows: BRANDS.filter(function (b) { return b.charts && b.charts.popup; }).map(function (b) {
        var best = b.charts.popup.rows.reduce(function (a, r) { return r.value > a.value ? r : a; });
        return {label: b.name, sub: best.sub, value: best.value, src: best.src, _b: b};
      })};
    var chart = popupMax.rows.length ? hbars(popupMax, BRANDS[0]) : "";
    return section("compare", "Compare", "ブランド比較",
      (BRANDS.length < 2 ? '<p class="callout">いまは1ブランドだけです。ブランドを追加すると、ここに列が自動で増えます。</p>' : "") +
      '<div class="card scroll-x"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      '<div style="margin-top:12px">' + chart + "</div>");
  }

  function renderHowto() {
    var sample = '{\n  "id": "brand2",            ← 英数字で。ページのアドレスになります\n  "name": "ブランド名",\n  "kana": "よみがな",\n  "status": "競合比較対象",\n  "concept": "コンセプトの説明",\n  "profile": [ {"k": "スタート", "v": "2021年", "src": ["S1"]} ],\n  "kpis": [ ... ],  "timeline": [ ... ],  "successes": [ ... ],\n  "risks": [ ... ], "charts": { ... },   "marketing": { ... },\n  "lessons": [ ... ], "sources": [ {"id": "S1", "title": "...", "site": "...", "url": "https://..."} ],\n  "compare": { "設立": "2021年", "主なSNS": "Instagram" }\n}';
    return section("howto", "How to add", "ブランドを追加するには",
      '<div class="cases">' +
      '<div class="card"><h3>いちばん簡単：Claudeに頼む</h3><p class="note" style="font-size:.88rem;color:var(--text)">「◯◯（ブランド名）を追加して」と伝えるだけで、Web調査をして同じ型（成り立ち・成功・課題・数字・マーケ分析・お店への活かし方・出典）でページを足します。</p></div>' +
      '<div class="card"><h3>自分で書き足す</h3><p class="note" style="font-size:.88rem;color:var(--text)">このHTMLファイルの中の <code>brand-data</code> という部分（JSON）の <code>"brands"</code> に、Bibiy.と同じ形のブロックをコピーして中身を書き換えます。保存すると切り替えボタン・比較表が自動で増えます。</p></div>' +
      "</div>" +
      '<details open><summary>書き足すブロックの形（抜粋）</summary><pre class="code">' + esc(sample) + "</pre></details>" +
      '<p class="note">"kind" に "fact"（事実）か "analysis"（分析）を書くと、ラベルが付きます。項目を省略するとエラーになる場合があるので、Bibiy.のブロックを丸ごとコピーして書き換えるのがおすすめです。</p>');
  }

  function route() {
    var id = (location.hash || "").replace(/^#/, "");
    if (!id && BRANDS[0]) id = BRANDS[0].id;
    var brand = BRANDS.filter(function (b) { return b.id === id; })[0];
    if (id === "compare") view.innerHTML = renderCompare();
    else if (id === "howto") view.innerHTML = renderHowto();
    else if (brand) view.innerHTML = renderBrand(brand);
    else { brand = BRANDS[0]; id = brand ? brand.id : ""; view.innerHTML = brand ? renderBrand(brand) : '<p class="note">ブランドのデータがありません。</p>'; }
    renderSwitcher(id);
  }

  // 目次ボタン・出典番号のクリック（ハッシュを使わずにスクロール）
  document.addEventListener("click", function (e) {
    var go = e.target.closest("[data-go]");
    if (go) { var t = document.getElementById(go.getAttribute("data-go")); if (t) t.scrollIntoView(); return; }
    var s = e.target.closest("[data-src]");
    if (s) {
      e.preventDefault();
      var li = document.getElementById(s.getAttribute("data-src"));
      if (li) { li.scrollIntoView({block: "center"}); li.style.background = "var(--accent-soft)"; setTimeout(function () { li.style.background = ""; }, 1600); }
    }
  });
  // グラフのツールチップ
  function showTip(el, x, y) { tip.textContent = el.getAttribute("data-tip"); tip.hidden = false; tip.style.left = Math.min(x + 12, window.innerWidth - 270) + "px"; tip.style.top = (y + 14) + "px"; }
  document.addEventListener("mousemove", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (t) showTip(t, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.addEventListener("focusin", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (t) { var r = t.getBoundingClientRect(); showTip(t, r.left, r.bottom); }
  });
  document.addEventListener("focusout", function () { tip.hidden = true; });

  window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
  route();
})();
</script>
</body>
</html>
