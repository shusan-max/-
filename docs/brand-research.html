<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: maximom風。グレージュの地にチェリーレッドを一点。1ページ1テーマ：ホーム → ブランド（8つの小ページ）→ 比較 */
:root {
  --bg: #e8e4db; --card: #f5f2ec; --text: #22252a; --muted: #6b655b;
  --line: #d6d0c4; --accent: #901d22; --accent-soft: #f1dedb; --on-accent: #f5f2ec;
  --bar: #901d22; --grid: #dbd5c9; --good: #56603f; --good-soft: #dfe1d2;
  --warn: #8a5a1e; --warn-soft: #efe2cc; --info: #2f3a52; --info-soft: #dcdfe4;
  --font: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e21; --card: #27292d; --text: #ece7de; --muted: #aaa397;
    --line: #3a3b40; --accent: #e57d80; --accent-soft: #3b2527; --on-accent: #1d1e21;
    --bar: #d9666b; --grid: #34363b; --good: #b9c39e; --good-soft: #2c3127;
    --warn: #dcaa6a; --warn-soft: #3a3022; --info: #aeb7c9; --info-soft: #2a2e36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e21; --card: #27292d; --text: #ece7de; --muted: #aaa397;
  --line: #3a3b40; --accent: #e57d80; --accent-soft: #3b2527; --on-accent: #1d1e21;
  --bar: #d9666b; --grid: #34363b; --good: #b9c39e; --good-soft: #2c3127;
  --warn: #dcaa6a; --warn-soft: #3a3022; --info: #aeb7c9; --info-soft: #2a2e36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.85; font-size: 15px; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-weight: 700; text-wrap: balance; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: .06em; }
h2 { font-size: 1.25rem; margin: 0 0 16px; letter-spacing: .04em; }
h3 { font-size: 1rem; margin: 0 0 4px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { color: var(--muted); font-size: .8rem; margin: 8px 0 0; }
.muted { color: var(--muted); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* サイト上部 */
.masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.masthead a { text-decoration: none; color: var(--text); }
.masthead .checked { font-size: .75rem; color: var(--muted); }
.sitenav { display: flex; gap: 4px; margin: 0 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.sitenav a { padding: 8px 12px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; font-size: .9rem; }
.sitenav a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.mainnav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 28px; }
.mainnav a { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 5px 14px; border-radius: 999px; font-size: .85rem; text-decoration: none; white-space: nowrap; }
.mainnav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ブランドページの見出しと小ページタブ */
.brandhead { margin-bottom: 4px; }
.brandhead .status { font-size: .72rem; color: var(--accent); letter-spacing: .1em; }
.brandname { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.2; margin: 2px 0 2px; letter-spacing: .02em; font-weight: 700; color: var(--accent); }
.brandname small { font-size: .42em; color: var(--muted); margin-left: 10px; font-weight: 400; letter-spacing: .08em; }
.subnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 0; overflow-x: auto; margin: 14px 0 26px; border-bottom: 1px solid var(--line); }
.subnav a { padding: 10px 12px; font-size: .85rem; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.subnav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.subnav a:hover { color: var(--text); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .88rem; }
.pager a { text-decoration: none; color: var(--text); }
.pager a span { display: block; font-size: .72rem; color: var(--muted); }
.pager .next { text-align: right; margin-left: auto; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.intro { font-size: .95rem; max-width: 40em; margin: 0 0 22px; }

/* ホーム */
.brandcards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.brandcard { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; transition: border-color .15s; }
.brandcard:hover { border-color: var(--accent); }
.brandcard .nm { font-size: 1.4rem; font-weight: 700; color: var(--accent); line-height: 1.3; }
.brandcard .kn { font-size: .75rem; color: var(--muted); letter-spacing: .08em; }
.brandcard .tl { font-size: .9rem; }
.brandcard .go { font-size: .8rem; color: var(--accent); margin-top: auto; padding-top: 8px; }
.brandcard.add { border-style: dashed; color: var(--muted); justify-content: center; align-items: center; text-align: center; min-height: 160px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .72rem; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.homefoot { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 28px; }
.homefoot h3 { font-size: .95rem; }
.homefoot p { margin: 0; font-size: .85rem; }

/* 概要 */
.concept { font-size: 1.05rem; font-weight: 600; margin: 0 0 6px; }
dl.profile { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px 14px; margin: 0; font-size: .9rem; }
dl.profile dt { color: var(--muted); }
dl.profile dd { margin: 0; min-width: 0; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 14px; }
.kpi .label { font-size: .75rem; color: var(--muted); }
.kpi .value { font-size: 1.35rem; font-weight: 700; line-height: 1.4; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: .75rem; color: var(--muted); line-height: 1.6; }
.stack { display: grid; gap: 14px; }

/* 出典・ラベル */
sup.src { font-size: .62rem; margin-left: 2px; white-space: nowrap; }
sup.src a { text-decoration: none; color: var(--muted); }
sup.src a:hover { color: var(--accent); }
.tag { display: inline-block; font-size: .68rem; font-weight: 600; padding: 0 7px; border-radius: 4px; vertical-align: 2px; margin-right: 6px; white-space: nowrap; line-height: 1.7; }
.tag.fact { background: var(--info-soft); color: var(--info); }
.tag.analysis { background: var(--warn-soft); color: var(--warn); }

/* 年表 */
ol.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
ol.timeline li { position: relative; padding: 0 0 24px 22px; }
ol.timeline li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
ol.timeline li.major::before { background: var(--accent); }
.tl-date { font-size: .78rem; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.tl-title { font-weight: 700; }
.tl-body { font-size: .88rem; color: var(--muted); margin-top: 2px; }

/* 成功事例 */
.cases { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.case p { margin: 6px 0 0; font-size: .88rem; }
.case .why { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: .84rem; color: var(--muted); }
.case .why b { color: var(--text); font-weight: 600; }

/* 課題 */
.callout { background: var(--info-soft); border-radius: 12px; padding: 12px 16px; font-size: .86rem; margin: 0 0 16px; }
.risk-row { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--card); }
.risk-row + .risk-row { margin-top: 10px; }
.risk-row > div { padding: 14px 18px; min-width: 0; }
.risk-row > div:first-child { border-right: 1px solid var(--line); }
.risk-row .lbl { font-size: .7rem; font-weight: 600; letter-spacing: .08em; margin-bottom: 4px; }
.risk-row .lbl.problem { color: var(--warn); }
.risk-row .lbl.fix { color: var(--good); }
.risk-row p { margin: 0; font-size: .88rem; }

/* グラフ */
.hbars { display: grid; gap: 12px; margin-top: 12px; }
.hb, .axis { display: grid; grid-template-columns: minmax(7em, 11em) 1fr 8em; gap: 10px; align-items: center; }
.hb { font-size: .84rem; }
.hb .lab { min-width: 0; line-height: 1.4; }
.hb .lab small { display: block; color: var(--muted); font-size: .72rem; }
.hb .track { position: relative; height: 14px; background: var(--grid); border-radius: 0 4px 4px 0; }
.hb .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.hb .fill.est { background: repeating-linear-gradient(135deg, var(--bar) 0 4px, transparent 4px 7px); border: 1px solid var(--bar); }
.hb .range { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--bar) 0 2px, transparent 2px 7px); opacity: .55; border-radius: 0 4px 4px 0; }
.hb .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.axis { font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
.axis .ticks { display: flex; justify-content: space-between; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .76rem; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 18px; height: 10px; vertical-align: -1px; margin-right: 5px; border-radius: 2px; }
.legend i.solid { background: var(--bar); }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); border: 1px solid var(--bar); }
.tooltip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: .78rem; z-index: 20; max-width: 260px; line-height: 1.5; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
thead th { color: var(--muted); font-weight: 600; white-space: nowrap; }
tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
details { margin-top: 10px; font-size: .84rem; }
summary { cursor: pointer; color: var(--muted); }

/* マーケ分析 */
.mtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.mtabs button { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 4px 14px; border-radius: 999px; cursor: pointer; }
.mtabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.mlead { font-size: .85rem; color: var(--muted); margin: 0 0 14px; }
.persona { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.plain { margin: 8px 0 0; padding-left: 1.2em; font-size: .88rem; }
.plain li { margin: 3px 0; }
.funnel { display: grid; gap: 8px; }
.fn { display: grid; grid-template-columns: 7.5em 1fr; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.fn .stage { background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 12px; font-size: .88rem; display: flex; flex-direction: column; justify-content: center; line-height: 1.4; }
.fn .stage small { font-weight: 400; font-size: .64rem; letter-spacing: .08em; }
.fn .body { padding: 12px 16px; font-size: .86rem; min-width: 0; }
.fn .body b { font-weight: 600; }
.fourp { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.swot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--card); }
.swot > div { padding: 16px 18px; min-width: 0; }
.swot > div:nth-child(1), .swot > div:nth-child(2) { border-bottom: 1px solid var(--line); }
.swot > div:nth-child(odd) { border-right: 1px solid var(--line); }
.swot h3 span { color: var(--muted); font-weight: 400; font-size: .72rem; margin-left: 6px; }

/* お店へのヒント */
ol.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: l; }
ol.lessons li { counter-increment: l; display: grid; grid-template-columns: 2em 1fr; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
ol.lessons li::before { content: counter(l); font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
ol.lessons h3 { margin: 0; }
ol.lessons p { margin: 4px 0 0; font-size: .88rem; }
ol.lessons .try { margin-top: 8px; font-size: .84rem; background: var(--good-soft); border-radius: 10px; padding: 8px 12px; }
ol.lessons .try b { color: var(--good); }

ol.sources { margin: 0; padding-left: 2.4em; font-size: .84rem; }
ol.sources li { margin: 6px 0; overflow-wrap: anywhere; }
.flash { background: var(--accent-soft); }
pre.code { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: .76rem; overflow-x: auto; line-height: 1.5; font-family: ui-monospace, Menlo, monospace; }
.placeholder { color: var(--muted); }

@media (max-width: 640px) {
  .fourp, .swot { grid-template-columns: 1fr; }
  .swot > div { border-right: 0 !important; border-bottom: 1px solid var(--line); }
  .swot > div:last-child { border-bottom: 0; }
  .risk-row { grid-template-columns: 1fr; }
  .risk-row > div:first-child { border-right: 0; border-bottom: 1px solid var(--line); }
  .hb, .axis { grid-template-columns: 6.5em 1fr 5.5em; gap: 8px; }
  .fn { grid-template-columns: 5.5em 1fr; }
  dl.profile { grid-template-columns: 5.5em 1fr; }
}
</style>
</head>

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("brand-data").textContent);
  var BRANDS = DATA.brands || [];
  var view = document.getElementById("view");
  var tip = document.getElementById("tip");
  var PAGES = [
    ["overview", "概要"], ["history", "成り立ち・年表"], ["success", "成功事例"], ["risks", "課題・失敗"],
    ["numbers", "数字"], ["marketing", "マーケ分析"], ["lessons", "お店へのヒント"], ["sources", "出典"]
  ];
  var mTab = "persona";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  function rich(s) { return esc(s).replace(/&lt;(\/?)b&gt;/g, "<$1b>"); }
  function list(a) { return a || []; }
  function srcs(ids, b) {
    ids = list(ids);
    if (!ids.length) return "";
    return '<sup class="src">' + ids.map(function (id) {
      var n = list(b.sources).map(function (s) { return s.id; }).indexOf(id) + 1;
      return '<a href="#' + esc(b.id) + '-sources" data-src="' + esc(b.id + "-" + id) + '" title="出典を見る">[' + (n || esc(id)) + "]</a>";
    }).join("") + "</sup>";
  }
  function kindTag(k) {
    if (k === "analysis") return '<span class="tag analysis">分析</span>';
    if (k === "fact") return '<span class="tag fact">事実</span>';
    return "";
  }
  function ul(items) { return '<ul class="plain">' + list(items).map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>"; }

  document.getElementById("checked").textContent = "確認日 " + (DATA.site.checked || "");

  function renderNav(current) {
    var items = [["home", "ホーム"]].concat(BRANDS.map(function (b) { return [b.id, b.name]; }), [["compare", "ブランド比較"], ["howto", "＋追加"]]);
    document.getElementById("mainnav").innerHTML = items.map(function (it) {
      return '<a href="#' + esc(it[0]) + '"' + (it[0] === current ? ' aria-current="page"' : "") + ">" + esc(it[1]) + "</a>";
    }).join("");
  }

  /* ---------- グラフ（横棒・同じ物差し） ---------- */
  function niceMax(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var st = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < st.length; i++) { if (st[i] * p >= v) return st[i] * p; }
    return 10 * p;
  }
  function fmt(v, unit) { return (v >= 1000 ? v.toLocaleString("ja-JP") : String(v)) + unit; }
  function hbars(chart, b) {
    var max = niceMax(Math.max.apply(null, chart.rows.map(function (r) { return r.high || r.value; })) * 1.05);
    var hasEst = chart.rows.some(function (r) { return r.kind === "estimate"; });
    var rows = chart.rows.map(function (r) {
      var w = (r.value / max * 100).toFixed(2);
      var label = r.high ? r.value + "〜" + fmt(r.high, chart.unit) : fmt(r.value, chart.unit);
      var t = r.label + "（" + r.sub + "）：" + label + (r.kind === "estimate" ? "　※試算" : "");
      var range = r.high ? '<span class="range" style="left:' + w + "%;width:" + ((r.high - r.value) / max * 100).toFixed(2) + '%"></span>' : "";
      return '<div class="hb"><div class="lab">' + esc(r.label) + "<small>" + esc(r.sub) + "</small></div>" +
        '<div class="track" tabindex="0" data-tip="' + esc(t) + '" aria-label="' + esc(t) + '"><span class="fill' + (r.kind === "estimate" ? " est" : "") + '" style="width:' + w + '%"></span>' + range + "</div>" +
        '<div class="num">' + esc(label) + srcs(r.src, r._b || b) + "</div></div>";
    }).join("");
    var ticks = [0, max / 2, max].map(function (t) { return "<span>" + esc(fmt(t, chart.unit)) + "</span>"; }).join("");
    var legend = hasEst ? '<div class="legend"><span><i class="solid"></i>報道値</span><span><i class="hatch"></i>試算（推定）</span></div>' : "";
    var table = '<details><summary>表で見る</summary><div class="scroll-x"><table><thead><tr><th>項目</th><th>時期</th><th>値</th><th>種別</th></tr></thead><tbody>' +
      chart.rows.map(function (r) {
        return "<tr><td>" + esc(r.label) + "</td><td>" + esc(r.sub) + '</td><td class="num">' + esc(r.high ? r.value + "〜" + fmt(r.high, chart.unit) : fmt(r.value, chart.unit)) + "</td><td>" + (r.kind === "estimate" ? "試算" : "報道値") + "</td></tr>";
      }).join("") + "</tbody></table></div></details>";
    return '<div class="card"><h3>' + esc(chart.title) + '</h3><div class="hbars">' + rows + "</div>" +
      '<div class="axis" aria-hidden="true"><span></span><div class="ticks">' + ticks + "</div><span></span></div>" +
      legend + (chart.note ? '<p class="note">' + esc(chart.note) + "</p>" : "") + table + "</div>";
  }

  /* ---------- ホーム ---------- */
  function renderHome() {
    var cards = BRANDS.map(function (b) {
      return '<a class="brandcard" href="#' + esc(b.id) + '"><span class="kn">' + esc(b.status) + '</span><span class="nm">' + esc(b.name) + '</span><span class="tl">' + esc(b.tagline || b.concept_word) + '</span><div class="chips">' +
        list(b.tags).map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + '</div><span class="go">くわしく見る →</span></a>';
    }).join("") + '<a class="brandcard add" href="#howto">＋ ブランドを追加する</a>';
    return '<p class="intro">SNSから人気になったブランドの成り立ち・成功事例・課題・数字・マーケティングを、出典付きでまとめた研究ノートです。自分の子供服ショップに活かすことを目的にしています。</p>' +
      '<h2>ブランド一覧</h2><div class="brandcards">' + cards + "</div>" +
      '<div class="homefoot"><a class="card" href="#compare" style="text-decoration:none;color:inherit"><h3>ブランド比較 →</h3><p class="muted">設立・販路・価格帯・成長のカギなどを横に並べて比べます。</p></a>' +
      '<div class="card"><h3>想定ターゲット</h3><p class="muted">' + esc(DATA.site.target_summary) + "</p></div></div>";
  }

  /* ---------- ブランドの小ページ ---------- */
  var BP = {
    overview: function (b) {
      return '<div class="stack"><div class="card"><p class="concept">' + esc(b.concept_word) + '</p><p style="margin:0;font-size:.9rem">' + esc(b.concept) + "</p></div>" +
        '<div class="card"><dl class="profile">' + list(b.profile).map(function (p) { return "<dt>" + esc(p.k) + "</dt><dd>" + esc(p.v) + srcs(p.src, b) + "</dd>"; }).join("") + "</dl></div></div>" +
        '<div class="kpis">' + list(b.kpis).map(function (k) {
          return '<div class="card kpi"><div class="label">' + esc(k.label) + '</div><div class="value">' + esc(k.value) + srcs(k.src, b) + '</div><div class="sub">' + esc(k.sub) + "</div></div>";
        }).join("") + "</div>";
    },
    history: function (b) {
      return '<ol class="timeline">' + list(b.timeline).map(function (t) {
        return '<li class="' + (t.major ? "major" : "") + '"><div class="tl-date">' + esc(t.date) + '</div><div class="tl-title">' + esc(t.title) + srcs(t.src, b) + '</div><div class="tl-body">' + esc(t.body) + "</div></li>";
      }).join("") + '</ol><p class="note">塗りつぶしの丸は、ブランドの転機になった出来事です。</p>';
    },
    success: function (b) {
      return '<div class="cases">' + list(b.successes).map(function (s) {
        return '<div class="card case"><h3>' + esc(s.title) + srcs(s.src, b) + "</h3><p>" + esc(s.body) + '</p><div class="why">' + rich(s.why) + "</div></div>";
      }).join("") + "</div>";
    },
    risks: function (b) {
      return (b.risks_note ? '<p class="callout">' + esc(b.risks_note) + "</p>" : "") + list(b.risks).map(function (r) {
        return '<div class="risk-row"><div><div class="lbl problem">起きたこと・リスク</div><p>' + kindTag(r.kind) + esc(r.problem) + srcs(r.src, b) + '</p></div><div><div class="lbl fix">対処・考え方</div><p>' + esc(r.fix) + "</p></div></div>";
      }).join("") + '<p class="note"><span class="tag fact">事実</span>報道・公式・利用者の投稿で確認できた内容　<span class="tag analysis">分析</span>このサイトによる推察</p>';
    },
    numbers: function (b) {
      var charts = list(b.charts).map(function (c) { return hbars(c, b); }).join("");
      var acc = list(b.sns_accounts);
      var sns = '<div class="card"><h3>Instagramフォロワー数</h3>' + (acc.length
        ? '<div class="scroll-x"><table><thead><tr><th>アカウント</th><th>時点</th><th>フォロワー</th></tr></thead><tbody>' + acc.map(function (a) { return "<tr><td>" + esc(a.account) + "</td><td>" + esc(a.when) + '</td><td class="num">' + esc(a.followers) + srcs(a.src, b) + "</td></tr>"; }).join("") + '</tbody></table></div><p class="note">記事ごとに時点が違う参考値です。最新の数はInstagramで直接確認してください。</p>'
        : '<p class="note">' + esc(b.sns_note || "フォロワー数は確認できていません。") + "</p>") + "</div>";
      return '<div class="stack">' + charts + sns + "</div>";
    },
    marketing: function (b) {
      var m = b.marketing || {};
      var tabs = [["persona", "ターゲット"], ["funnel", "集客〜ファン化"], ["fourp", "4P"], ["swot", "SWOT"]];
      var body = "";
      if (mTab === "persona") {
        body = '<p class="mlead">誰に、どんな気持ちで買われているか。</p><div class="persona">' + ["core", "target"].map(function (k) {
          var p = (m.persona || {})[k]; if (!p) return "";
          return '<div class="card"><h3>' + kindTag(p.kind || "fact") + esc(p.title) + srcs(p.src, b) + "</h3>" + ul(p.items) + "</div>";
        }).join("") + "</div>";
      } else if (mTab === "funnel") {
        body = '<p class="mlead">知ってから、買って、人に広めるまでの流れ。</p><div class="funnel">' + list(m.funnel).map(function (f) {
          return '<div class="fn"><div class="stage">' + esc(f.stage) + "<small>" + esc(f.en) + '</small></div><div class="body">' + rich(f.body) + srcs(f.src, b) + "</div></div>";
        }).join("") + "</div>";
      } else if (mTab === "fourp") {
        body = '<p class="mlead">商品・価格・販路・販促の4つの視点で整理。</p><div class="fourp">' + ["product", "price", "place", "promotion"].map(function (k) {
          var p = (m.fourp || {})[k]; if (!p) return "";
          return '<div class="card"><h3>' + esc(p.title) + srcs(p.src, b) + "</h3>" + ul(p.items) + "</div>";
        }).join("") + "</div>";
      } else {
        var s = m.swot || {};
        body = '<p class="mlead">強み・弱み（ブランドの内側）と、機会・脅威（外の環境）。</p><div class="swot">' + ["s", "w", "o", "t"].map(function (k) {
          var p = s[k] || {items: []};
          return "<div><h3>" + esc(p.title) + "<span>" + esc(p.en) + "</span></h3>" + ul(p.items) + "</div>";
        }).join("") + "</div>" + (s.note ? '<p class="note">' + esc(s.note) + "</p>" : "");
      }
      return '<div class="mtabs" role="group" aria-label="分析の種類">' + tabs.map(function (t) {
        return '<button type="button" data-mtab="' + t[0] + '" aria-pressed="' + (t[0] === mTab) + '">' + t[1] + "</button>";
      }).join("") + "</div>" + body;
    },
    lessons: function (b) {
      return '<p class="intro">' + esc(b.name) + "の事例から、自分の子供服ショップで試せることをまとめました。</p>" +
        '<ol class="lessons">' + list(b.lessons).map(function (l) {
          return "<li><div><h3>" + esc(l.title) + "</h3><p>" + esc(l.body) + '</p><div class="try"><b>試すなら：</b>' + esc(l.try) + "</div></div></li>";
        }).join("") + "</ol>";
    },
    sources: function (b) {
      return '<div class="card"><ol class="sources">' + list(b.sources).map(function (s) {
        return '<li id="' + esc(b.id + "-" + s.id) + '"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a> <span class="muted">— ' + esc(s.site) + "</span></li>";
      }).join("") + '</ol><p class="note">確認日：' + esc(b.checked) + "。売上などの数値は各メディアの報道で、ブランドの公式発表ではないものを含みます。</p></div>";
    }
  };

  function renderBrand(b, page) {
    var idx = PAGES.map(function (p) { return p[0]; }).indexOf(page);
    var title = PAGES[idx][1];
    var prev = PAGES[idx - 1], next = PAGES[idx + 1];
    var link = function (p) { return "#" + b.id + (p[0] === "overview" ? "" : "-" + p[0]); };
    return '<div class="brandhead"><div class="status">' + esc(b.status) + '</div><div class="brandname">' + esc(b.name) + "<small>" + esc(b.kana) + "</small></div></div>" +
      '<nav class="subnav" aria-label="' + esc(b.name) + 'のページ">' + PAGES.map(function (p) {
        return '<a href="' + link(p) + '"' + (p[0] === page ? ' aria-current="page"' : "") + ">" + p[1] + "</a>";
      }).join("") + "</nav>" +
      "<h2>" + esc(title) + "</h2>" + BP[page](b) +
      '<nav class="pager" aria-label="前後のページ">' +
      (prev ? '<a href="' + link(prev) + '"><span>← 前へ</span>' + prev[1] + "</a>" : "") +
      (next ? '<a class="next" href="' + link(next) + '"><span>次へ →</span>' + next[1] + "</a>" : "") + "</nav>";
  }

  /* ---------- 比較 ---------- */
  function renderCompare() {
    var keys = [];
    BRANDS.forEach(function (b) { Object.keys(b.compare || {}).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); }); });
    var head = "<tr><th>項目</th>" + BRANDS.map(function (b) { return '<th><a href="#' + esc(b.id) + '">' + esc(b.name) + "</a></th>"; }).join("") + "</tr>";
    var body = keys.map(function (k) {
      return "<tr><th>" + esc(k) + "</th>" + BRANDS.map(function (b) { return "<td>" + esc((b.compare || {})[k] || "—") + "</td>"; }).join("") + "</tr>";
    }).join("");
    var lessons = '<div class="cases" style="margin-top:14px">' + BRANDS.map(function (b) {
      return '<div class="card case"><h3>' + esc(b.name) + 'から学ぶこと</h3>' + ul(list(b.lessons).slice(0, 3).map(function (l) { return l.title; })) + '<p><a href="#' + esc(b.id) + '-lessons">すべて見る →</a></p></div>';
    }).join("") + "</div>";
    return "<h2>ブランド比較</h2>" +
      '<div class="card scroll-x"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +

  }

  /* ---------- 追加方法 ---------- */
  function renderHowto() {
    var sample = '{\n  "id": "brand3",          ← 英数字で（ページのアドレスになります）\n  "name": "ブランド名",  "kana": "よみがな",\n  "status": "比較対象",  "tagline": "ひとことで",\n  "tags": ["子供服", "Instagram"],\n  "concept_word": "...",  "concept": "...",\n  "profile": [...], "kpis": [...], "timeline": [...],\n  "successes": [...], "risks": [...], "charts": [...],\n  "marketing": {...}, "lessons": [...],\n  "sources": [ {"id": "X1", "title": "...", "site": "...", "url": "https://..."} ],\n  "compare": { "設立": "...", "主な販路": "..." }\n}';
    return "<h2>ブランドを追加するには</h2>" +
      '<div class="cases"><div class="card"><h3>Claudeに頼む</h3><p style="font-size:.88rem;margin:6px 0 0">「◯◯を追加して」と伝えるだけで、Web調査をして同じ型でページを足します。</p></div>' +
      '<div class="card"><h3>自分で書き足す</h3><p style="font-size:.88rem;margin:6px 0 0">このHTMLファイルの <code>brand-data</code> 部分（JSON）の <code>"brands"</code> に、既存ブランドのブロックをコピーして書き換えます。ホーム・切り替え・比較表が自動で増えます。</p></div></div>' +
      '<details open><summary>ブロックの形（抜粋）</summary><pre class="code">' + esc(sample) + "</pre></details>" +
      '<p class="note">"charts" や "sns_accounts" は空でも動きます。迷ったら House on the Hill のブロックを丸ごとコピーするのがおすすめです。</p>';
  }

  /* ---------- ルーティング ---------- */
  function route() {
    var h = (location.hash || "").replace(/^#/, "") || "home";
    var html, nav = h;
    if (h === "home") html = renderHome();
    else if (h === "compare") html = renderCompare();
    else if (h === "howto") html = renderHowto();
    else {
      var b = null, page = "overview";
      BRANDS.forEach(function (x) {
        if (h === x.id) b = x;
        else if (h.indexOf(x.id + "-") === 0 && BP[h.slice(x.id.length + 1)]) { b = x; page = h.slice(x.id.length + 1); }
      });
      if (b) { html = renderBrand(b, page); nav = b.id; } else { html = renderHome(); nav = "home"; }
    }
    view.innerHTML = html;
    renderNav(nav);
  }

  document.addEventListener("click", function (e) {
    var mt = e.target.closest("[data-mtab]");
    if (mt) { mTab = mt.getAttribute("data-mtab"); route(); return; }
    var s = e.target.closest("[data-src]");
    if (s) {
      e.preventDefault();
      var id = s.getAttribute("data-src"), bid = id.split("-")[0];
      if (location.hash !== "#" + bid + "-sources") location.hash = bid + "-sources";
      setTimeout(function () {
        var li = document.getElementById(id);
        if (li) { li.scrollIntoView({block: "center"}); li.classList.add("flash"); setTimeout(function () { li.classList.remove("flash"); }, 1600); }
      }, 80);
    }
  });
  function showTip(el, x, y) { tip.textContent = el.getAttribute("data-tip"); tip.hidden = false; tip.style.left = Math.min(x + 12, window.innerWidth - 270) + "px"; tip.style.top = (y + 14) + "px"; }
  document.addEventListener("mousemove", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (t) showTip(t, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.addEventListener("focusin", function (e) {
    var t = e.target.closest && e.target.closest("[data-tip]");
    if (t) { var r = t.getBoundingClientRect(); showTip(t, r.left, r.bottom); }
  });
  document.addEventListener("focusout", function () { tip.hidden = true; });
  window.addEventListener("hashchange", function () { route(); window.scrollTo(0, 0); });
  route();
})();
</script>
</body>
</html>
