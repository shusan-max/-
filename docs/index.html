<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>子供服マーケット情報ボード</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2a28; --muted: #77736c;
    --line: #e8e3dc; --accent: #d9654b; --accent-soft: #fbe9e4; --new: #2f8f6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b1a; --card: #262523; --text: #ecebe8; --muted: #a09c95;
      --line: #3a3835; --accent: #f08a70; --accent-soft: #3d2a25; --new: #5cc59b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: .85rem; margin: 0 0 20px; }
  .search {
    width: 100%; padding: 10px 14px; font-size: 1rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font-size: .9rem; cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .n { opacity: .7; margin-left: 4px; font-size: .8rem; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  }
  .item a { color: var(--text); text-decoration: none; font-weight: 600; }
  .item a:hover { color: var(--accent); text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; font-size: .8rem; color: var(--muted); }
  .cat { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 6px; }
  .new { color: var(--new); font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>子供服マーケット情報ボード</h1>
  <p class="updated" id="updated"></p>
  <input class="search" id="q" type="search" placeholder="記事タイトル・媒体名で絞り込み（例：ベビー、Instagram）">
  <div class="tabs" id="tabs" role="group" aria-label="カテゴリ"></div>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>該当する記事がありません</p>
</div>
<script>
const DATA = {"title": "子供服マーケット情報ボード", "updated": "未取得（初回の自動収集をお待ちください）", "categories": ["子供服トレンド", "競合・ブランド動向", "EC・ネットショップ", "SNS・マーケティング", "注目SNSブランド", "市場・消費動向"], "articles": []};
const state = { cat: "すべて", q: "" };
const $ = (id) => document.getElementById(id);
$("updated").textContent = "最終更新：" + DATA.updated + "（直近の記事 " + DATA.articles.length + " 件）";

function fmt(iso) {
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function renderTabs() {
  const names = ["すべて", ...DATA.categories];
  $("tabs").replaceChildren(...names.map((name) => {
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("aria-pressed", String(state.cat === name));
    const n = name === "すべて" ? DATA.articles.length : DATA.articles.filter((a) => a.category === name).length;
    b.textContent = name;
    const s = document.createElement("span"); s.className = "n"; s.textContent = n;
    b.append(s);
    b.onclick = () => { state.cat = name; renderTabs(); renderList(); };
    return b;
  }));
}

function renderList() {
  const q = state.q.trim().toLowerCase();
  const dayAgo = Date.now() - 24 * 3600 * 1000;
  const rows = DATA.articles.filter((a) =>
    (state.cat === "すべて" || a.category === state.cat) &&
    (!q || (a.title + " " + a.source).toLowerCase().includes(q)));
  $("empty").hidden = rows.length > 0;
  $("list").replaceChildren(...rows.map((a) => {
    const li = document.createElement("li"); li.className = "item";
    const link = document.createElement("a");
    link.href = a.link; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = a.title;
    const meta = document.createElement("div"); meta.className = "meta";
    if (new Date(a.published).getTime() > dayAgo) {
      const n = document.createElement("span"); n.className = "new"; n.textContent = "NEW"; meta.append(n);
    }
    const c = document.createElement("span"); c.className = "cat"; c.textContent = a.category;
    const src = document.createElement("span"); src.textContent = a.source || "";
    const t = document.createElement("span"); t.textContent = fmt(a.published);
    meta.append(c, src, t);
    li.append(link, meta);
    return li;
  }));
}

$("q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
renderTabs(); renderList();
</script>
</body>
</html>
