name: ニュース収集

on:
  schedule:
    - cron: "0 21 * * *"  # 毎朝 6:00（日本時間）
  workflow_dispatch:       # Actions 画面の「Run workflow」で手動実行も可能

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/collect.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "ニュースを更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          git push
